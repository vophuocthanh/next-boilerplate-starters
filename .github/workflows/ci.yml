name: Deploy Next to Docker 🐼

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🐋 Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Short name the image
        id: next-image
        run: |
          echo "short_name=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: 📦 Build and push Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: |
            vophuocthanh/next-boilerplate-starters:latest
            vophuocthanh/next-boilerplate-starters:${{ steps.next-image.outputs.short_name }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
